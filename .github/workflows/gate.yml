name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Candidate must stay green
        run: >
          robogate gate scenarios/real
          --baseline fixtures/gate/baseline.parquet
          --candidate fixtures/gate/candidate.parquet
      - name: Known-bad published checkpoint must stay red
        run: |
          if robogate gate scenarios/real \
            --baseline fixtures/gate/baseline.parquet \
            --candidate fixtures/gate/known-bad/published-b.parquet; then
            echo "gate accepted the published checkpoint; the door is broken" >&2
            exit 1
          fi
      - name: Official sim-cube ACT must stay green
        run: >
          robogate gate scenarios/sim-cube
          --baseline fixtures/gate/sim-cube/baseline.parquet
          --candidate fixtures/gate/sim-cube/candidate.parquet
